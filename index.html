
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101010">
<title>Gridder</title>
<style>
:root{color-scheme:dark;--bg:#101010;--panel:#1c1c1e;--accent:#ff3b70}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;overscroll-behavior:none}
body{height:100dvh;min-height:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);gap:8px;overflow:hidden}
header{height:40px;min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none;min-width:0}
.brandbox{min-width:0;flex:1}
.brand{font-size:20px;font-weight:800;letter-spacing:-.5px;line-height:1.1;white-space:nowrap}
header small{display:block;font-size:9px;color:#888;letter-spacing:.7px;white-space:nowrap}
.topbar{display:flex;align-items:center;gap:6px;flex:none;min-width:0}
select,button,input{font:inherit;color:inherit}
select,button{background:var(--panel);border:1px solid #333;border-radius:11px}
select{font-size:12px;padding:8px 7px;width:clamp(112px,34vw,142px);min-width:0}
.iconbtn{width:35px;height:35px;flex:none;padding:0;display:grid;place-items:center;font-size:18px;color:var(--accent)}
.export{font-size:11px;padding:8px 9px;white-space:nowrap}
.stage{min-height:0;flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#preview{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;background:#222;touch-action:none;border-radius:2px}
.hint{position:absolute;bottom:3px;left:0;right:0;text-align:center;color:#777;font-size:10px;pointer-events:none}
.controls{flex:none;background:var(--panel);border:1px solid #2c2c2e;border-radius:15px;padding:9px;display:flex;flex-direction:column;gap:8px;max-width:100%}
.row{display:flex;align-items:center;gap:7px;min-width:0}
.row label{font-size:11px;color:#bbb;white-space:nowrap}
.row .grow{flex:1;min-width:30px}
input[type=number]{width:55px;min-width:0;background:#111;border:1px solid #444;border-radius:8px;padding:6px;font-size:12px}
input[type=range]{width:100%;min-width:20px;accent-color:var(--accent)}
input[type=color]{width:30px;height:28px;padding:0;border:0;background:none;flex:none}
.presets,.tools{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.presets::-webkit-scrollbar,.tools::-webkit-scrollbar{display:none}
.presets button,.tools button{white-space:nowrap;font-size:11px;padding:8px 10px;flex:none}
.presets button.active{border-color:var(--accent);background:#3a1d29}
.note{font-size:9px;color:#777;text-align:center;line-height:1.35}
#file{display:none}
@media(max-width:370px){
 body{padding-left:9px;padding-right:9px;gap:6px}
 .brand{font-size:18px}
 header small{display:none}
 .controls{padding:7px;gap:6px}
 .presets button,.tools button{padding:7px 8px;font-size:10px}
 .export{padding:7px 8px}
}
@media(orientation:landscape){
 body{gap:5px}
 header{height:32px;min-height:32px}
 .controls{padding:6px;gap:5px}
 .note{display:none}
}
</style>
</head>
<body>
<header>
 <div class="brandbox">
  <div class="brand">Gridder</div>
  <small>PHOTO COLLAGE STUDIO</small>
 </div>
 <div class="topbar">
  <select id="ratio" aria-label="キャンバス比率">
   <option value="9:16">Story 9:16</option>
   <option value="4:5">Instagram 4:5</option>
   <option value="1:1">Square 1:1</option>
   <option value="1.91:1">Wide 1.91:1</option>
   <option value="16:9">X 16:9</option>
   <option value="3:4">X 3:4</option>
  </select>
  <button class="iconbtn" id="saveTemplate" title="テンプレート保存">▣</button>
  <button class="export" id="export">PNG保存</button>
 </div>
</header>

<main class="stage" id="stage">
 <canvas id="preview" width="1080" height="1920"></canvas>
 <div class="hint">空白セルをタップして写真を追加 · 写真をドラッグして位置調整</div>
</main>

<section class="controls">
 <div class="row">
  <label>余白</label>
  <div class="grow"><input id="gap" type="range" min="0" max="60" value="8"></div>
  <input id="gapNum" type="number" min="0" max="200" value="8">
  <label>px</label>
  <label>色</label>
  <input id="bg" type="color" value="#ffffff">
 </div>

 <div class="presets" id="presets">
  <button data-layout="h2" class="active">上下2分割</button>
  <button data-layout="h3">上下3分割</button>
  <button data-layout="h3middle">上下3分割・中央左右2分割</button>
  <button data-layout="v2">左右2分割</button>
  <button data-layout="grid4">2×2</button>
  <button data-layout="big3">大1＋小3</button>
 </div>

 <div class="tools">
  <button id="add">＋ 写真追加</button>
  <button id="rotate">↻ 90°回転</button>
  <button id="delete">写真を削除</button>
  <button id="clear">全消去</button>
 </div>

 <div class="note">設定した余白(px)を、写真同士の間とキャンバス外周4辺に同じ幅で適用します。</div>
</section>

<input id="file" type="file" accept="image/*" multiple>

<script>
(()=>{
const $=id=>document.getElementById(id);
const canvas=$('preview');
const ctx=canvas.getContext('2d');

const ratios={
 '9:16':[9,16],
 '4:5':[4,5],
 '1:1':[1,1],
 '1.91:1':[1.91,1],
 '16:9':[16,9],
 '3:4':[3,4]
};

let ratio='9:16';
let gap=8;
let bg='#ffffff';
let layout='h2';
let cells=[];
let selected=-1;
let pending=-1;
let drag=null;
let suppressClick=false;

const defs={
 h2:[
  [0,0,1,.5],
  [0,.5,1,.5]
 ],
 h3:[
  [0,0,1,1/3],
  [0,1/3,1,1/3],
  [0,2/3,1,1/3]
 ],
 h3middle:[
  [0,0,1,1/3],
  [0,1/3,.5,1/3],
  [.5,1/3,.5,1/3],
  [0,2/3,1,1/3]
 ],
 v2:[
  [0,0,.5,1],
  [.5,0,.5,1]
 ],
 grid4:[
  [0,0,.5,.5],
  [.5,0,.5,.5],
  [0,.5,.5,.5],
  [.5,.5,.5,.5]
 ],
 big3:[
  [0,0,.66,1],
  [.66,0,.34,1/3],
  [.66,1/3,.34,1/3],
  [.66,2/3,.34,1/3]
 ]
};

function makeCells(key){
 layout=key;
 cells=defs[key].map(r=>({
  r:[...r],
  img:null,
  scale:1,
  ox:0,
  oy:0,
  rot:0
 }));
 selected=-1;
 draw();
 document.querySelectorAll('.presets button').forEach(b=>{
  b.classList.toggle('active',b.dataset.layout===key);
 });
}

function dims(){
 let [w,h]=ratios[ratio];
 return w/h;
}

function fitCanvas(){
 let stage=$('stage');
 let ar=dims();
 let maxW=stage.clientWidth;
 let maxH=stage.clientHeight;
 let w=maxW;
 let h=w/ar;

 if(h>maxH){
  h=maxH;
  w=h*ar;
 }

 canvas.style.width=Math.max(1,w)+'px';
 canvas.style.height=Math.max(1,h)+'px';
}

function cellRect(c){
 let [x,y,w,h]=c.r;
 let W=canvas.width;
 let H=canvas.height;
 let g=gap;

 return {
  x:g+x*(W-g),
  y:g+y*(H-g),
  w:w*(W-g)-g,
  h:h*(H-g)-g
 };
}

function clampPan(c){
 if(!c.img)return;

 let r=cellRect(c);
 let iw=c.img.naturalWidth;
 let ih=c.img.naturalHeight;

 if(Math.abs(c.rot)%180===90){
  [iw,ih]=[ih,iw];
 }

 let s=Math.max(r.w/iw,r.h/ih)*c.scale;
 let dw=iw*s;
 let dh=ih*s;

 let mx=Math.max(0,(dw-r.w)/2/r.w);
 let my=Math.max(0,(dh-r.h)/2/r.h);

 c.ox=Math.max(-mx,Math.min(mx,c.ox));
 c.oy=Math.max(-my,Math.min(my,c.oy));
}

function draw(){
 const [rw,rh]=ratios[ratio];
 let W=1080;
 let H=Math.round(1080*rh/rw);

 if(H>5000){
  H=5000;
  W=Math.round(H*rw/rh);
 }

 canvas.width=W;
 canvas.height=H;

 ctx.fillStyle=bg;
 ctx.fillRect(0,0,W,H);

 cells.forEach((c,i)=>{
  let r=cellRect(c);
  let x=r.x;
  let y=r.y;
  let w=Math.max(1,r.w);
  let h=Math.max(1,r.h);

  ctx.save();
  ctx.beginPath();
  ctx.rect(x,y,w,h);
  ctx.clip();

  if(c.img){
   clampPan(c);

   let im=c.img;
   ctx.translate(
    x+w/2+c.ox*w,
    y+h/2+c.oy*h
   );
   ctx.rotate(c.rot*Math.PI/180);

   let iw=im.naturalWidth;
   let ih=im.naturalHeight;

   if(Math.abs(c.rot)%180===90){
    [iw,ih]=[ih,iw];
   }

   let s=Math.max(w/iw,h/ih)*c.scale;

   ctx.drawImage(
    im,
    -iw*s/2,
    -ih*s/2,
    iw*s,
    ih*s
   );
  }else{
   ctx.fillStyle='#29292b';
   ctx.fillRect(x,y,w,h);
   ctx.fillStyle='#777';
   ctx.font=`bold ${Math.max(24,Math.min(W,H)*.035)}px sans-serif`;
   ctx.textAlign='center';
   ctx.textBaseline='middle';
   ctx.fillText('+',x+w/2,y+h/2);
  }

  ctx.restore();

  if(i===selected){
   ctx.strokeStyle='#ff3b70';
   ctx.lineWidth=Math.max(3,W/360);
   ctx.strokeRect(x+2,y+2,w-4,h-4);
  }
 });

 fitCanvas();
}

function pos(e){
 let b=canvas.getBoundingClientRect();

 return {
  x:(e.clientX-b.left)/b.width*canvas.width,
  y:(e.clientY-b.top)/b.height*canvas.height
 };
}

function hit(p){
 for(let i=cells.length-1;i>=0;i--){
  let r=cellRect(cells[i]);

  if(
   p.x>=r.x &&
   p.x<=r.x+r.w &&
   p.y>=r.y &&
   p.y<=r.y+r.h
  ){
   return i;
  }
 }

 return -1;
}

canvas.addEventListener('pointerdown',e=>{
 let p=pos(e);
 let i=hit(p);

 if(i<0)return;

 selected=i;
 let c=cells[i];

 if(c.img){
  let r=cellRect(c);

  drag={
   id:e.pointerId,
   x:p.x,
   y:p.y,
   ox:c.ox,
   oy:c.oy,
   w:r.w,
   h:r.h
  };

  canvas.setPointerCapture(e.pointerId);
  suppressClick=false;
 }else{
  suppressClick=true;
  openPicker(i);
 }

 draw();
});

canvas.addEventListener('pointermove',e=>{
 if(!drag || drag.id!==e.pointerId)return;

 let p=pos(e);
 let c=cells[selected];

 c.ox=drag.ox+(p.x-drag.x)/drag.w;
 c.oy=drag.oy+(p.y-drag.y)/drag.h;

 clampPan(c);
 suppressClick=true;
 draw();
});

canvas.addEventListener('pointerup',()=>{
 drag=null;
});

canvas.addEventListener('pointercancel',()=>{
 drag=null;
});

canvas.addEventListener('click',e=>{
 if(suppressClick){
  suppressClick=false;
  return;
 }

 let i=hit(pos(e));

 if(i>=0){
  selected=i;

  if(!cells[i].img){
   openPicker(i);
  }else{
   draw();
  }
 }
});

function openPicker(i){
 pending=i;
 $('file').click();
}

$('file').addEventListener('change',e=>{
 let files=[...e.target.files];

 if(!files.length)return;

 let start=pending>=0
  ?pending
  :Math.max(0,cells.findIndex(c=>!c.img));

 files.forEach((f,n)=>{
  let idx=start+n;

  if(idx>=cells.length)return;

  let url=URL.createObjectURL(f);
  let im=new Image();

  im.onload=()=>{
   cells[idx].img=im;
   cells[idx].scale=1;
   cells[idx].ox=0;
   cells[idx].oy=0;
   selected=idx;
   draw();
   URL.revokeObjectURL(url);
  };

  im.src=url;
 });

 pending=-1;
 e.target.value='';
});

$('add').onclick=()=>{
 openPicker(
  selected>=0
   ?selected
   :Math.max(0,cells.findIndex(c=>!c.img))
 );
};

$('rotate').onclick=()=>{
 if(selected>=0 && cells[selected].img){
  cells[selected].rot=(cells[selected].rot+90)%360;
  clampPan(cells[selected]);
  draw();
 }
};

$('delete').onclick=()=>{
 if(selected>=0){
  cells[selected].img=null;
  cells[selected].scale=1;
  cells[selected].ox=0;
  cells[selected].oy=0;
  draw();
 }
};

$('clear').onclick=()=>{
 cells.forEach(c=>c.img=null);
 selected=-1;
 draw();
};

$('presets').addEventListener('click',e=>{
 let b=e.target.closest('button[data-layout]');

 if(b){
  makeCells(b.dataset.layout);
 }
});

$('ratio').onchange=e=>{
 ratio=e.target.value;
 draw();
};

$('gap').oninput=e=>{
 gap=+e.target.value;
 $('gapNum').value=gap;
 draw();
};

$('gapNum').onchange=e=>{
 gap=Math.max(0,Math.min(200,+e.target.value||0));
 $('gap').value=Math.min(60,gap);
 e.target.value=gap;
 draw();
};

$('bg').oninput=e=>{
 bg=e.target.value;
 draw();
};

$('saveTemplate').onclick=()=>{
 localStorage.setItem(
  'gridder-template',
  JSON.stringify({ratio,gap,bg,layout})
 );

 alert('テンプレートを保存しました');
};

$('export').onclick=()=>{
 let a=document.createElement('a');
 a.download='Gridder.png';
 a.href=canvas.toDataURL('image/png');
 a.click();
};

window.addEventListener('resize',fitCanvas);

makeCells('h2');

let saved=localStorage.getItem('gridder-template');

if(saved){
 try{
  let s=JSON.parse(saved);

  ratio=s.ratio||ratio;
  gap=s.gap??gap;
  bg=s.bg||bg;

  $('ratio').value=ratio;
  $('gap').value=Math.min(60,gap);
  $('gapNum').value=gap;
  $('bg').value=bg;

  makeCells(defs[s.layout]?s.layout:'h2');
 }catch{}
}

})();
</script>
</body>
</html>
